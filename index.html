<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EcoTenis · Quadras & Bar</title>
<script src="config.js"></script>
<meta name="theme-color" content="#1E6B45">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F0; --surface:#FFFFFF; --surface-2:#FAFBF7; --ink:#15201A; --ink-2:#465248; --muted:#7A847C; --line:#E1E4DA;
  --accent:#1E6B45; --accent-2:#155235; --accent-soft:#E2EFE6; --ball:#D6EC5C;
  --amber:#9A6412; --amber-soft:#FBF0DA; --red:#B42318; --red-soft:#FCE9E7; --blue:#23519B; --blue-soft:#E5EDF9;
  --gray-soft:#EEF0EA; --r:14px; --r-sm:10px; --shadow:0 1px 2px rgba(21,32,26,.06),0 6px 20px rgba(21,32,26,.06);
  --f-display:'Bebas Neue',Impact,sans-serif; --f-body:'Inter',system-ui,-apple-system,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.hidden{display:none!important}
h1,h2,h3{margin:0}
.display{font-family:var(--f-display);letter-spacing:.02em;font-weight:400}

/* ---------- componentes base ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:600;font-size:14px;transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:hover{border-color:#C9CEC1}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--red);border-color:#F2C8C3;background:#fff}
.btn.block{width:100%} .btn.lg{padding:14px 20px;font-size:16px}
.btn.sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--gray-soft);color:var(--ink-2);white-space:nowrap}
.chip.green{background:var(--accent-soft);color:var(--accent)} .chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.red{background:var(--red-soft);color:var(--red)} .chip.blue{background:var(--blue-soft);color:var(--blue)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:11px 12px;outline:none}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:flex;gap:10px;align-items:center} .row.wrap{flex-wrap:wrap} .grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.divider{height:1px;background:var(--line);margin:14px 0}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px}
.kv b{font-weight:600}
.seg{display:inline-flex;background:var(--gray-soft);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.spinner{width:22px;height:22px;border:3px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:24px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- demo strip ---------- */
.demo-strip{background:#15201A;color:#DDE5D8;font-size:12px;padding:6px 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.demo-strip b{color:var(--ball)} .demo-strip a{color:#fff;text-decoration:none;padding:2px 8px;border-radius:999px;border:1px solid #3a463d}
.demo-strip a.on{background:var(--ball);color:#15201A;border-color:var(--ball)}

/* ---------- sheet / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,22,18,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .15s}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:-8px auto 12px}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.sheet-head h2{font-size:20px;font-weight:700}
.x{border:0;background:var(--gray-soft);width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1;flex:none}
@media(min-width:760px){.overlay.side{justify-content:flex-end;align-items:stretch}.overlay.side .sheet{border-radius:0;max-height:none;height:100%;max-width:440px;animation:left .2s ease-out}
  .overlay:not(.side){align-items:center}.overlay:not(.side) .sheet{border-radius:20px}}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(30px);opacity:.4}} @keyframes left{from{transform:translateX(30px);opacity:.4}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:80;box-shadow:var(--shadow);max-width:90vw;animation:up .2s}
.toast.err{background:var(--red)}

/* ============ JOGADOR ============ */
.player{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:96px}
.p-hero{padding:22px 18px 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand .ball{width:30px;height:30px;border-radius:50%;background:var(--ball);position:relative;flex:none;box-shadow:inset -3px -3px 0 rgba(0,0,0,.08)}
.brand .ball:before,.brand .ball:after{content:"";position:absolute;inset:3px;border:2px solid #fff;border-radius:50%;clip-path:inset(0 55% 0 0)}
.brand .ball:after{clip-path:inset(0 0 0 55%)}
.brand h1{font-family:var(--f-display);font-size:34px;line-height:.9;letter-spacing:.02em}
.p-sub{color:var(--muted);font-size:13px;margin-top:4px}
.p-section{padding:6px 18px 18px}
.p-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px}
.dates{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 6px;margin:0 -18px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.date{flex:none;width:58px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 0;text-align:center}
.date .wd{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.date .dn{font-family:var(--f-display);font-size:26px;line-height:1}
.date .mo{font-size:10px;color:var(--muted);text-transform:uppercase}
.date.on{background:var(--ink);border-color:var(--ink);color:#fff}.date.on .wd,.date.on .mo{color:#BFC8BF}
.court{margin-top:12px}
.court-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.court-h h3{font-size:16px;font-weight:700}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.slot{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 0 7px;text-align:center;font-family:var(--f-mono);font-weight:600;font-size:14px}
.slot small{display:block;font-family:var(--f-body);font-size:11px;font-weight:500;color:var(--muted);margin-top:1px}
.slot:hover{border-color:var(--accent);background:var(--accent-soft)}
.slot.off{opacity:.38;text-decoration:line-through;pointer-events:none;background:transparent}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{display:flex;max-width:560px;width:100%}
.tabbar button{flex:1;border:0;background:transparent;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--accent)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 4px;margin:0 -18px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px}
.cat.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.item{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .nm{font-weight:600}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;font-weight:600;line-height:1}
.qty button.add{background:var(--accent);border-color:var(--accent);color:#fff}
.qty span{min-width:18px;text-align:center;font-weight:700}
.cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;width:calc(100% - 28px);max-width:532px;z-index:31}
.cartbar .btn{width:100%;justify-content:space-between;padding:14px 20px;box-shadow:var(--shadow)}
.status-line{display:flex;gap:6px;margin-top:10px}
.status-line i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.status-line i.on{background:var(--accent)}
.bk{padding:14px;margin-bottom:10px}
.bk-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bk-when{font-family:var(--f-display);font-size:24px;line-height:1}
.qr{width:220px;height:220px;margin:4px auto 12px;display:block;border-radius:12px;border:1px solid var(--line);background:#fff;padding:8px}
.copy{display:flex;gap:8px}
.copy input{flex:1;font-family:var(--f-mono);font-size:12px}
.pay-opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--surface);width:100%;text-align:left}
.pay-opt:hover{border-color:var(--accent)}
.pay-opt .ic{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);flex:none}
.notice{background:var(--amber-soft);color:#6B470C;border-radius:12px;padding:10px 12px;font-size:13px}
.notice.green{background:var(--accent-soft);color:var(--accent-2)}
.success-mark{width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;margin:8px auto 12px}
.foot-link{text-align:center;padding:24px 0 8px;font-size:12px}
.foot-link a{color:var(--muted)}

/* ============ STAFF (recepção/admin) ============ */
.staff{min-height:100vh}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.topbar .brand h1{font-size:26px}
.topbar .role{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;border-left:1px solid var(--line);padding-left:12px}
.datenav{display:flex;align-items:center;gap:6px}
.datenav .lbl{font-weight:700;min-width:150px;text-align:center}
.recep{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px 20px}
@media(max-width:600px){#r-date{display:none}.topbar{padding:10px 12px;gap:8px}}
@media(max-width:1000px){.recep{grid-template-columns:minmax(0,1fr);padding:12px}.datenav .lbl{min-width:0}}
.tl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:calc(100vh - 150px)}
.tl{display:grid;position:relative;min-width:560px}
.tl-head{position:sticky;top:0;background:var(--surface);z-index:5;border-bottom:1px solid var(--line);padding:10px 8px;font-weight:700;font-size:13px}
.tl-head small{display:block;font-weight:500;color:var(--muted)}
.tl-time{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding:0 8px;text-align:right;border-right:1px solid var(--line);position:relative}
.tl-time span{position:relative;top:-7px}
.tl-col{position:relative;border-right:1px solid var(--line)}
.tl-col:last-child{border-right:0}
.tl-cell{border-top:1px dashed #ECEEE7;cursor:pointer}
.tl-cell.hour{border-top:1px solid var(--line)}
.tl-cell:hover{background:var(--accent-soft)}
.bkb{position:absolute;left:4px;right:4px;border-radius:9px;padding:5px 8px;font-size:12px;overflow:hidden;cursor:pointer;border-left:4px solid;box-shadow:0 1px 2px rgba(0,0,0,.05);z-index:2}
.bkb b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bkb .mono{display:block;line-height:1.3}
.bkb.confirmada{background:var(--accent-soft);border-color:var(--accent)}
.bkb.pendente_pagamento{background:var(--amber-soft);border-color:#D39A2C}
.bkb.checkin{background:var(--blue-soft);border-color:var(--blue)}
.bkb.concluida{background:var(--gray-soft);border-color:#A9B0A6;color:var(--ink-2)}
.bkb.no_show{background:var(--red-soft);border-color:var(--red)}
.blk{position:absolute;left:4px;right:4px;border-radius:9px;padding:5px 8px;font-size:12px;color:var(--ink-2);background:repeating-linear-gradient(135deg,#EEF0EA 0 8px,#E3E6DD 8px 16px);z-index:1;cursor:pointer}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:4;pointer-events:none}
.nowline:before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.side h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}
.tabitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surface);cursor:pointer;width:100%;text-align:left}
.tabitem:hover{border-color:var(--accent)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.stats{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.stat{flex:1;min-width:90px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .v{font-family:var(--f-display);font-size:28px;line-height:1}
.stat .l{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.lines .ln{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.minimenu{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:0 12px}
.minimenu .item{padding:8px 0}
/* ---------- catálogo com fotos ---------- */
.thumb{border-radius:12px;object-fit:cover;background:var(--gray-soft);flex:none;display:block}
.item .thumb{border:1px solid var(--line)}
.cap-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cap-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px solid var(--line);border-radius:16px;padding:20px 10px;background:var(--surface);cursor:pointer;text-align:center}
.cap-btn svg{width:30px;height:30px;color:var(--accent)} .cap-btn span{font-size:12px;color:var(--muted)}
.cap-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.cap-btn.primary svg,.cap-btn.primary span{color:#DCEFE3}
.cap-btn:focus-within{outline:3px solid var(--accent-soft)}
.cat-shot{position:relative;width:220px;height:220px;margin:6px auto 12px;border-radius:16px;overflow:hidden;background:var(--gray-soft);display:grid;place-items:center}
.cat-shot img{width:100%;height:100%;object-fit:cover}
.scanline{position:absolute;left:0;right:0;height:3px;background:var(--ball);box-shadow:0 0 12px var(--ball);animation:scan 1.4s ease-in-out infinite alternate}
@keyframes scan{from{top:6%}to{top:92%}}
.rec-card{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--surface)}
.rec-card.off{opacity:.55}
.rec-card.exist{background:var(--accent-soft);border-color:transparent}
.photo-cell{position:relative;width:52px}
.photo-cell label{position:absolute;right:-6px;bottom:-6px;width:26px;height:26px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;font-size:13px;box-shadow:var(--shadow)}

/* ============ ADMIN ============ */
.admin{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 60px)}
@media(max-width:860px){.admin{grid-template-columns:minmax(0,1fr)}.amain{padding:16px}.admin .anav{padding:8px;gap:4px}.admin .anav button{width:auto;white-space:nowrap;padding:8px 12px}.anav{display:flex;overflow-x:auto;border-right:0!important;border-bottom:1px solid var(--line)}.anav button{flex:none}}
.anav{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px}
.anav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--ink-2)}
.anav button.on{background:var(--accent-soft);color:var(--accent-2)}
.amain{padding:22px 24px;max-width:1100px}
.amain h2{font-size:22px;font-weight:700;margin-bottom:4px}
.amain .lead{color:var(--muted);margin:0 0 18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-family:var(--f-display);font-size:34px;line-height:1.05;margin-top:4px}
.kpi .s{font-size:12px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 8px;border-bottom:1px solid var(--line);font-weight:700}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.num,.tbl th.num{text-align:right;font-family:var(--f-mono)}
.tbl .input{padding:7px 8px;font-size:13px;border-radius:8px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 8px}
.bar-in{height:8px;border-radius:4px;background:var(--gray-soft);position:relative;min-width:80px}
.bar-in i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--accent)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:18px}
.mode{border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;text-align:left;width:100%}
.mode.on{border-color:var(--accent);background:var(--accent-soft)}
.mode h4{margin:0 0 6px;font-size:16px}
.mode p{margin:0;font-size:13px;color:var(--ink-2)}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.check{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;user-select:none}
.check input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.wdays{display:inline-flex;gap:3px}
.wdays label{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;cursor:pointer;background:var(--surface)}
.wdays input{display:none}
.wdays label:has(input:checked){background:var(--accent);border-color:var(--accent);color:#fff}
.sect{margin-bottom:24px}
.sect h3{font-size:15px;margin:0 0 10px}
.savebar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 10px;display:flex;gap:10px;justify-content:flex-end}

/* ---------- preço dinâmico ---------- */
.pz-k{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.pz-src{margin-bottom:20px}
.seg button[disabled]{opacity:.4;cursor:not-allowed}
.pz-heat-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.pz-heat{display:grid;gap:2px;min-width:640px}
.pz-hh{font-size:10px;color:var(--muted);text-align:center;padding-bottom:2px}
.pz-wd{font-size:12px;font-weight:600;color:var(--ink-2);display:flex;align-items:center}
.pz-c{height:30px;border-radius:4px;display:grid;place-items:center;font:600 11px var(--f-mono);color:var(--ink);cursor:default;background:var(--gray-soft)}
.pz-c:hover{outline:2px solid var(--ink);outline-offset:1px;position:relative;z-index:1}
.pz-c.nodata,.pz-nd{background:repeating-linear-gradient(135deg,#F1F2EE 0 4px,#E4E6E0 4px 8px)}
.pz-legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.pz-legend i{width:26px;height:10px;border-radius:2px;display:inline-block}
.pz-nd{width:18px;height:10px;border-radius:2px;display:inline-block;margin-left:12px}
.pz-tip{position:fixed;z-index:90;background:var(--ink);color:#fff;font-size:12px;line-height:1.45;padding:8px 10px;border-radius:8px;pointer-events:none;max-width:280px;box-shadow:var(--shadow)}
.pz-tip .muted{color:#B9C3BB}
.pz-mx td{vertical-align:top}
.pz-mx td:first-child{min-width:170px} .pz-mx td:first-child .mono{white-space:nowrap}
.pz-cell{min-width:230px}
.pz-price{font-size:20px;font-weight:600}
.pz-neg{color:var(--accent);font-weight:600} .pz-pos{color:var(--amber);font-weight:600}
.pz-step{display:flex;align-items:center;gap:4px;margin:8px 0}
.pz-step button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.pz-step input{width:60px;text-align:center}
.pz-occ{position:relative;height:8px;border-radius:4px;background:var(--gray-soft);overflow:hidden}
.pz-occ i{position:absolute;left:0;top:0;bottom:0;background:var(--ink-2);border-radius:4px}
.pz-band{position:absolute;top:0;bottom:0;background:var(--accent-soft);border-left:1px solid #9CC9AC;border-right:1px solid #9CC9AC}
.pz-sug{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;margin-top:8px;background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:6px 8px;font-size:12px}
.pz-sug.ok{color:var(--accent);border-style:solid;background:var(--accent-soft);border-color:transparent;font-weight:600}
.pz-sug.muted{color:var(--muted)}
.pz-impact{display:flex;flex-wrap:wrap;gap:28px;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.pz-impact .mono{font-size:18px;font-weight:600}
.slot.promo{border-color:var(--ball);background:#F6FBE3}
.slot .promo-tag{display:block;font:700 10px var(--f-body);color:#5A6B10;margin-top:1px}

/* ============ BAR (tela escura) ============ */
.barv{background:#0E1411;color:#E8EEE6;min-height:100vh;--line:#223029}
.barv .topbar{background:#0E1411;border-color:#223029}
.barv .topbar .role{border-color:#223029;color:#8FA094}
.barv .btn{background:#16201B;border-color:#2A3A31;color:#E8EEE6}
.barv .btn.primary{background:var(--ball);border-color:var(--ball);color:#0E1411}
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:16px 20px}
@media(max-width:900px){.kanban{grid-template-columns:1fr}}
.kcol h2{font-family:var(--f-display);font-size:28px;font-weight:400;letter-spacing:.03em;display:flex;align-items:center;gap:10px;margin:0 0 10px}
.kcol h2 .n{font-family:var(--f-mono);font-size:14px;background:#1C2822;border-radius:999px;padding:2px 10px}
.ocard{background:#16201B;border:1px solid #243229;border-radius:16px;padding:14px;margin-bottom:12px}
.ocard.new{animation:pulse 1.6s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(214,236,92,.35)}}
.ocard .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ocard .code{font-family:var(--f-display);font-size:30px;letter-spacing:.04em;line-height:1}
.ocard .age{font-family:var(--f-mono);font-size:13px;color:#8FA094}
.ocard .age.warn{color:#F0B84A} .ocard .age.late{color:#FF7A6B}
.ocard .who{font-size:14px;color:#AAB8AE;margin:4px 0 10px}
.ocard ul{list-style:none;margin:0 0 12px;padding:0}
.ocard li{font-size:19px;font-weight:600;padding:3px 0}
.ocard li b{font-family:var(--f-mono);color:var(--ball);margin-right:8px}
.ocard .note{background:#2A2414;color:#F0CF7A;border-radius:10px;padding:6px 10px;font-size:14px;margin-bottom:12px}
.ocard .acts{display:flex;gap:8px}
.ocard .acts .btn{flex:1}
.recent{padding:0 20px 24px;color:#8FA094;font-size:13px}
.recent span{display:inline-block;margin:0 10px 6px 0;background:#16201B;border-radius:999px;padding:4px 10px}

/* ---------- login ---------- */
.login{max-width:360px;margin:12vh auto;padding:0 18px;text-align:center}
.pin{font-family:var(--f-mono);font-size:28px;text-align:center;letter-spacing:.4em}
</style>

<body>
<div id="demo-strip"></div>
<div id="app"><div class="spinner"></div></div>
<div id="layer"></div>

<script>
/* ============================================================================
 * PadelEye Arena — Core (EcoTenis)
 * Regras de negócio compartilhadas: reservas de quadra, comandas, pedidos do bar
 * e pagamentos. O MESMO código roda no Google Apps Script (backend real) e no
 * navegador (modo demo). Nada aqui toca Sheets, fetch ou DOM: o acesso a dados
 * entra por um "repo" e o gateway de pagamento por um "provider".
 * ========================================================================== */
var PEArena = (function () {
  'use strict';

  var VERSION = 'ARENA_V2.1';

  /* ------------------------------------------------------------------ schema */
  // Tipos: s=string, n=number, b=boolean, j=json
  var TABLES = {
    courts: { key: 'court_id', fields: {
      court_id: 's', name: 's', sport: 's', env: 's', surface: 's', active: 'b', sort: 'n' } },
    price_rules: { key: 'rule_id', fields: {
      rule_id: 's', label: 's', court_id: 's', env: 's', weekdays: 's', start: 's', end: 's',
      price_hour: 'n', active: 'b' } },
    bookings: { key: 'booking_id', fields: {
      booking_id: 's', code: 's', court_id: 's', date: 's', start: 's', end: 's', duration_min: 'n',
      customer_name: 's', phone: 's', email: 's', status: 's', price: 'n', online_amount: 'n',
      pay_mode: 's', payment_status: 's', tab_id: 's', source: 's', notes: 's', expires_at: 's',
      created_at: 's', updated_at: 's' } },
    blocks: { key: 'block_id', fields: {
      block_id: 's', court_id: 's', date: 's', start: 's', end: 's', reason: 's', created_at: 's' } },
    menu: { key: 'item_id', fields: {
      item_id: 's', category: 's', name: 's', description: 's', price: 'n', active: 'b', sort: 'n',
      image_url: 's', image_id: 's', barcode: 's', source: 's' } },
    tabs: { key: 'tab_id', fields: {
      tab_id: 's', label: 's', phone: 's', customer_name: 's', booking_id: 's', status: 's',
      opened_at: 's', closed_at: 's' } },
    orders: { key: 'order_id', fields: {
      order_id: 's', code: 's', tab_id: 's', booking_id: 's', phone: 's', customer_name: 's',
      location: 's', items_json: 'j', total: 'n', status: 's', pay_mode: 's', payment_status: 's',
      note: 's', expires_at: 's', created_at: 's', updated_at: 's' } },
    payments: { key: 'payment_id', fields: {
      payment_id: 's', ref_type: 's', ref_id: 's', tab_id: 's', amount: 'n', method: 's',
      channel: 's', provider_ref: 's', status: 's', qr_code: 's', qr_b64: 's', checkout_url: 's',
      note: 's', created_at: 's', updated_at: 's' } },
    config: { key: 'key', fields: { key: 's', value: 's' } },
    history: { key: 'hist_id', fields: {
      hist_id: 's', batch: 's', date: 's', start: 's', end: 's', duration_min: 'n', env: 's', court_id: 's',
      price: 'n', created_at: 's' } },
    log: { key: 'log_id', fields: {
      log_id: 's', ts: 's', role: 's', action: 's', ref: 's', detail: 's' } }
  };

  var CONFIG_SCHEMA = {
    club_name:            ['s', 'EcoTenis'],
    tagline:              ['s', 'Reserve sua quadra e peça do bar'],
    open_time:            ['t', '07:00'],
    close_time:           ['t', '23:00'],
    slot_step_min:        ['n', 30],
    durations_min:        ['nl', '60,90,120'],
    default_duration_min: ['n', 90],
    booking_window_days:  ['n', 14],
    min_advance_min:      ['n', 30],
    default_price_hour:   ['n', 120],
    payment_mode:         ['e:comanda|online|misto', 'comanda'],
    online_methods:       ['l', 'pix,cartao'],
    counter_methods:      ['l', 'dinheiro,pix,debito,credito'],
    booking_deposit_pct:  ['n', 100],
    payment_hold_min:     ['n', 15],
    cancel_min_hours:     ['n', 12],
    max_installments:     ['n', 1],
    bar_open:             ['b', true],
    order_needs_booking:  ['b', false],
    whatsapp:             ['s', ''],
    pricing_json:         ['s', ''],
    history_courts_json:  ['s', ''],
    tz_offset_min:        ['n', -180]
  };

  var BOOKING_FLOW = {
    pendente_pagamento: ['confirmada', 'cancelada'],
    confirmada: ['checkin', 'cancelada', 'no_show'],
    checkin: ['concluida', 'confirmada'],
    no_show: ['confirmada'],
    concluida: [],
    cancelada: []
  };
  var ORDER_FLOW = {
    aguardando_pagamento: ['novo', 'cancelado'],
    novo: ['preparando', 'cancelado'],
    preparando: ['pronto', 'cancelado'],
    pronto: ['entregue', 'preparando'],
    entregue: [],
    cancelado: []
  };
  var HOLDING = { pendente_pagamento: 1, confirmada: 1, checkin: 1, concluida: 1 };

  var METHOD_LABEL = { pix: 'Pix', cartao: 'Cartão de crédito', dinheiro: 'Dinheiro',
    debito: 'Débito', credito: 'Crédito' };

  /* ----------------------------------------------------------------- errors */
  function AppError(code, message) { this.code = code; this.message = message; }
  AppError.prototype = Object.create(Error.prototype);
  function fail(code, msg) { throw new AppError(code, msg); }

  /* ---------------------------------------------------------------- helpers */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function toMin(t) {
    if (t === null || t === undefined || t === '') return NaN;
    var p = String(t).split(':');
    return Number(p[0]) * 60 + Number(p[1] || 0);
  }
  function toHHMM(m) { return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  function round2(x) { return Math.round((Number(x) || 0) * 100) / 100; }
  function overlaps(aS, aE, bS, bE) { return aS < bE && bS < aE; }
  function digits(s) { return String(s || '').replace(/\D+/g, ''); }
  function normPhone(s) {
    var d = digits(s);
    if (d.length > 11 && d.indexOf('55') === 0) d = d.slice(2);
    return d;
  }
  function isDate(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s)); }
  function isTime(s) { return /^\d{2}:\d{2}$/.test(String(s)); }
  function addDays(date, n) {
    var p = date.split('-').map(Number);
    var d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n));
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  }
  function weekday(date) {
    var p = date.split('-').map(Number);
    return new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay();
  }
  function local(ms, off) {
    var d = new Date(ms + off * 60000);
    return {
      date: d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()),
      min: d.getUTCHours() * 60 + d.getUTCMinutes()
    };
  }
  function epochOf(date, min, off) {
    var p = date.split('-').map(Number);
    return Date.UTC(p[0], p[1] - 1, p[2], 0, min) - off * 60000;
  }
  function iso(ms) { return new Date(ms).toISOString(); }
  var ALNUM = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function rand(n) { var s = ''; for (var i = 0; i < n; i++) s += ALNUM[Math.floor(Math.random() * ALNUM.length)]; return s; }
  function newId(prefix, ms) { return prefix + '_' + ms.toString(36).toUpperCase() + rand(4); }
  function str(x) { return x === null || x === undefined ? '' : String(x); }

  /* ------------------------------------------------------------- normalize */
  function coerce(type, v) {
    if (type === 'n') { if (v === '' || v === null || v === undefined) return 0; var n = Number(v); return isNaN(n) ? 0 : n; }
    if (type === 'b') { if (typeof v === 'boolean') return v; var s = String(v).toLowerCase().trim(); return s === 'true' || s === 'sim' || s === '1' || s === 'yes'; }
    if (type === 'j') {
      if (v && typeof v === 'object') return v;
      if (!v) return [];
      try { return JSON.parse(v); } catch (e) { return []; }
    }
    return str(v);
  }
  function normalizeRow(table, obj) {
    var def = TABLES[table]; if (!def) return obj;
    var out = {};
    for (var f in def.fields) out[f] = coerce(def.fields[f], obj[f]);
    return out;
  }
  // Para gravar em planilha: JSON vira string, boolean vira TRUE/FALSE
  function serializeRow(table, obj) {
    var def = TABLES[table]; var out = {};
    for (var f in def.fields) {
      var t = def.fields[f], v = obj[f];
      if (t === 'j') out[f] = JSON.stringify(v || []);
      else if (t === 'b') out[f] = v ? 'TRUE' : 'FALSE';
      else if (t === 'n') out[f] = (v === '' || v === undefined || v === null) ? 0 : Number(v);
      else out[f] = str(v);
    }
    return out;
  }

  function parseConfig(rows) {
    var raw = {};
    (rows || []).forEach(function (r) { if (r && r.key) raw[String(r.key).trim()] = r.value; });
    var cfg = {};
    for (var k in CONFIG_SCHEMA) {
      var type = CONFIG_SCHEMA[k][0], dflt = CONFIG_SCHEMA[k][1];
      var present = raw.hasOwnProperty(k) && (raw[k] !== '' || type === 'l');
      var v = present ? raw[k] : dflt;
      cfg[k] = parseConfigValue(type, v, dflt);
    }
    if (cfg.durations_min.indexOf(cfg.default_duration_min) < 0) cfg.default_duration_min = cfg.durations_min[0];
    return cfg;
  }
  function parseConfigValue(type, v, dflt) {
    if (type === 'n') { var n = Number(v); return isNaN(n) ? Number(dflt) : n; }
    if (type === 'b') return coerce('b', v);
    if (type === 't') return isTime(v) || v === '24:00' ? String(v) : dflt;
    if (type === 'nl') {
      var arr = (Array.isArray(v) ? v : String(v).split(',')).map(Number).filter(function (x) { return x > 0; });
      return arr.length ? arr : String(dflt).split(',').map(Number);
    }
    if (type === 'l') return (Array.isArray(v) ? v : String(v).split(',')).map(function (x) { return String(x).trim(); }).filter(Boolean);
    if (type.indexOf('e:') === 0) { var opts = type.slice(2).split('|'); return opts.indexOf(String(v)) >= 0 ? String(v) : dflt; }
    return str(v);
  }
  function configToRows(cfg) {
    var rows = [];
    for (var k in CONFIG_SCHEMA) {
      if (!cfg.hasOwnProperty(k)) continue;
      var v = cfg[k];
      rows.push({ key: k, value: Array.isArray(v) ? v.join(',') : String(v) });
    }
    return rows;
  }
  function validateConfig(cfg) {
    var o = toMin(cfg.open_time), c = toMin(cfg.close_time);
    if (!(c > o)) fail('config', 'Horário de fechamento deve ser depois da abertura.');
    if ([15, 30, 60].indexOf(cfg.slot_step_min) < 0) fail('config', 'Intervalo de grade deve ser 15, 30 ou 60 min.');
    cfg.durations_min.forEach(function (d) {
      if (d % cfg.slot_step_min !== 0) fail('config', 'Durações devem ser múltiplas do intervalo da grade.');
    });
    if (cfg.booking_deposit_pct < 1 || cfg.booking_deposit_pct > 100) fail('config', 'Sinal deve ficar entre 1% e 100%.');
    if (cfg.payment_mode !== 'comanda' && !cfg.online_methods.length)
      fail('config', 'Com pagamento online, escolha pelo menos Pix ou cartão.');
    cfg.online_methods.forEach(function (m) { if (m !== 'pix' && m !== 'cartao') fail('config', 'Método online inválido: ' + m); });
    return true;
  }

  /* --------------------------------------------------------------- pricing */
  function ruleScore(rule, court) {
    if (rule.court_id && rule.court_id !== '*') return rule.court_id === court.court_id ? 3 : -1;
    if (rule.env && rule.env !== '*') return rule.env === court.env ? 2 : -1;
    return 1;
  }
  function ruleFor(rules, court, date, min) {
    var wd = String(weekday(date)), best = null, bestScore = 0;
    for (var i = 0; i < rules.length; i++) {
      var r = rules[i];
      if (!r.active) continue;
      var days = String(r.weekdays || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean);
      if (days.length && days.indexOf(wd) < 0) continue;
      if (!(min >= toMin(r.start) && min < toMin(r.end))) continue;
      var s = ruleScore(r, court);
      if (s > bestScore) { best = r; bestScore = s; }
    }
    return best;
  }
  function priceFor(cfg, rules, court, date, startMin, durMin) {
    var step = cfg.slot_step_min, total = 0;
    for (var m = startMin; m < startMin + durMin; m += step) {
      var r = ruleFor(rules, court, date, m);
      var ph = r ? r.price_hour : cfg.default_price_hour;
      total += ph * Math.min(step, startMin + durMin - m) / 60;
    }
    return round2(total);
  }

  /* ---------------------------------------------------------- availability */
  function isHolding(b, nowMs) {
    if (!HOLDING[b.status]) return false;
    if (b.status === 'pendente_pagamento' && b.expires_at && Date.parse(b.expires_at) <= nowMs) return false;
    return true;
  }
  function conflicts(bookings, blocks, courtId, date, s, e, ignoreId, nowMs) {
    for (var i = 0; i < bookings.length; i++) {
      var b = bookings[i];
      if (b.court_id !== courtId || b.date !== date || b.booking_id === ignoreId) continue;
      if (!isHolding(b, nowMs)) continue;
      if (overlaps(s, e, toMin(b.start), toMin(b.end))) return { type: 'booking', ref: b };
    }
    for (var j = 0; j < blocks.length; j++) {
      var k = blocks[j];
      if ((k.court_id !== courtId && k.court_id !== '*') || k.date !== date) continue;
      if (overlaps(s, e, toMin(k.start), toMin(k.end))) return { type: 'block', ref: k };
    }
    return null;
  }
  function availability(cfg, data, date, durMin, nowMs) {
    var off = cfg.tz_offset_min, now = local(nowMs, off), model = pricingModel(cfg);
    var open = toMin(cfg.open_time), close = toMin(cfg.close_time), step = cfg.slot_step_min;
    var courts = data.courts.filter(function (c) { return c.active; })
      .sort(function (a, b) { return (a.sort || 0) - (b.sort || 0); });
    return courts.map(function (c) {
      var slots = [];
      for (var m = open; m + durMin <= close; m += step) {
        var st = 'livre';
        var past = date < now.date || (date === now.date && m < now.min + cfg.min_advance_min);
        var hit = conflicts(data.bookings, data.blocks, c.court_id, date, m, m + durMin, null, nowMs);
        if (past) st = 'passado';
        else if (hit) st = hit.type === 'block' ? 'bloqueado' : 'ocupado';
        var fp = finalPrice(cfg, model, data.price_rules, c, date, m, durMin, nowMs);
        slots.push({ start: toHHMM(m), end: toHHMM(m + durMin), status: st, price: fp.price, full: fp.full, promo_pct: fp.promo_pct });
      }
      return { court_id: c.court_id, name: c.name, sport: c.sport, env: c.env, surface: c.surface, slots: slots };
    });
  }

  /* -------------------------------------------------------- payment policy */
  function onlineEnabled(cfg) { return cfg.payment_mode !== 'comanda' && cfg.online_methods.length > 0; }
  function bookingPlan(cfg, price, isStaff) {
    if (isStaff || !onlineEnabled(cfg)) return { online: false, online_amount: 0, needs_tab: true };
    var dep = round2(price * cfg.booking_deposit_pct / 100);
    if (dep >= price) dep = price;
    return { online: true, online_amount: dep, needs_tab: dep < price };
  }
  function orderPlan(cfg, isStaff) {
    if (isStaff) return { online: false };
    return { online: cfg.payment_mode === 'online' && cfg.online_methods.length > 0 };
  }

  /* -------------------------------------------------------------- summaries */
  function tabSummary(tab, data) {
    var lines = [], charges = 0, paid = 0;
    var bIds = {};
    data.bookings.forEach(function (b) {
      if (b.tab_id !== tab.tab_id || b.status === 'cancelada') return;
      bIds[b.booking_id] = 1;
      var court = findBy(data.courts, 'court_id', b.court_id);
      lines.push({ type: 'reserva', ref: b.booking_id, desc: (court ? court.name : b.court_id) + ' · ' +
        fmtDateShort(b.date) + ' ' + b.start + '–' + b.end, amount: b.price });
      charges += b.price;

    function applyApproved(d, pay, ms) {
      if (pay.ref_type === 'booking') {
        var b = findBy(d.bookings, 'booking_id', pay.ref_id);
        if (!b) return;
        if (b.status === 'pendente_pagamento' || b.status === 'cancelada') {
          // Pago depois do prazo de retenção: confirma se o horário ainda estiver livre
          var lateClash = b.status === 'pendente_pagamento' && b.expires_at && Date.parse(b.expires_at) <= ms &&
            conflicts(d.bookings, d.blocks || [], b.court_id, b.date, toMin(b.start), toMin(b.end), b.booking_id, ms);
          if (b.status === 'cancelada' || lateClash) {
            b.status = 'cancelada'; b.payment_status = 'reembolso_pendente';
            b.notes = (b.notes ? b.notes + ' · ' : '') + 'pago após expirar';
          } else {
            b.status = 'confirmada';
            b.payment_status = b.online_amount >= b.price ? 'pago' : 'sinal_pago';
            b.expires_at = '';
          }
          b.updated_at = iso(ms); save('bookings', b);
          if (b.status === 'confirmada' && b.online_amount < b.price) {
            var tab = ensureBookingTab(d, b);
            pay.tab_id = tab.tab_id;
          }
        }
      } else if (pay.ref_type === 'order') {
        var o = findBy(d.orders, 'order_id', pay.ref_id);
        if (!o) return;
        if (o.status === 'aguardando_pagamento') { o.status = 'novo'; o.payment_status = 'pago'; o.expires_at = ''; }
        else if (o.status === 'cancelado') { o.payment_status = 'reembolso_pendente'; }
        o.updated_at = iso(ms); save('orders', o);
      }
    }

            cancelled: 'cancelado', refunded: 'estornado', charged_back: 'estornado' };

// Repo em memória + provider simulado — usados nos testes Node e (mesma lógica) no modo demo do HTML
function MemoryRepo(PE, initial) {
  var db = {};
  Object.keys(PE.TABLES).forEach(function (t) { db[t] = []; });
  if (initial) Object.keys(initial).forEach(function (t) {
    db[t] = initial[t].map(function (r) { return PE.serializeRow(t, PE.normalizeRow(t, r)); });
  });
  return {
    db: db,
    all: function (t) { return db[t].map(function (r) { return Object.assign({}, r); }); },
    upsert: function (t, rows) {
      var key = PE.TABLES[t].key;
      rows.forEach(function (r) {
        var i = db[t].findIndex(function (x) { return x[key] === r[key]; });
        if (i >= 0) db[t][i] = Object.assign({}, r); else db[t].push(Object.assign({}, r));
      });
    },
    replaceAll: function (t, rows) { db[t] = rows.map(function (r) { return Object.assign({}, r); }); },
    remove: function (t, ids) { var key = PE.TABLES[t].key; db[t] = db[t].filter(function (x) { return ids.indexOf(x[key]) < 0; }); }
  };
}

function fakeQR(text) {
  // QR ilustrativo para o modo demo (não é um QR válido)
  var n = 25, h = 0, cells = '';
  for (var i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) >>> 0;
  function rnd() { h ^= h << 13; h >>>= 0; h ^= h >> 17; h ^= h << 5; h >>>= 0; return h / 4294967296; }
  function finder(x, y) { return '<rect x="' + x + '" y="' + y + '" width="7" height="7" fill="#15201A"/><rect x="' + (x + 1) + '" y="' + (y + 1) + '" width="5" height="5" fill="#fff"/><rect x="' + (x + 2) + '" y="' + (y + 2) + '" width="3" height="3" fill="#15201A"/>'; }
  for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) {
    if ((x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9)) continue;
    if (rnd() > 0.52) cells += '<rect x="' + x + '" y="' + y + '" width="1" height="1"/>';
  }
  return '<svg class="qr" viewBox="-1 -1 ' + (n + 2) + ' ' + (n + 2) + '" shape-rendering="crispEdges"><g fill="#15201A">' + cells + '</g>' + finder(0, 0) + finder(n - 7, 0) + finder(0, n - 7) + '</svg>';
}

  loadMine: function () {
    var c = S.boot.config;
    api('my_bookings', { phone: S.me.phone }).then(function (list) {
      // atualiza pagamentos pendentes (ex.: volta do Checkout Pro)
      var pend = list.filter(function (x) { return x.pending_payment; });
      if (pend.length && Date.now() - (Player._recheckAt || 0) > 20000) {
        Player._recheckAt = Date.now();
        Promise.all(pend.map(function (x) { return api('check_payment', { payment_id: x.pending_payment.payment_id }).catch(function () {}); }))
          .then(function () { Player.loadMine(); });
      }
      var box = document.getElementById('m-list'); if (!box) return;
      var today = c.today, nm = nowLocal();
      var up = list.filter(function (x) { return x.booking.date > today || (x.booking.date === today && U.toMin(x.booking.end) > nm.min); }).filter(function (x) { return x.booking.status !== 'cancelada' || x.booking.payment_status === 'reembolso_pendente'; });
      var past = list.filter(function (x) { return up.indexOf(x) < 0; }).reverse().slice(0, 10);
      Player.mineList = list;
      var card = function (x, isUp) {
        var b = x.booking, p = dParts(b.date);
        var canCancel = isUp && ['pendente_pagamento', 'confirmada'].indexOf(b.status) >= 0 &&

        return '<div class="card bk"><div class="bk-top"><div><div class="bk-when">' + (b.date === today ? 'HOJE' : WD[p.wd] + ' ' + dShort(b.date)) + ' · ' + b.start + '</div>' +
          '<div class="small muted" style="margin-top:4px">' + esc(x.court_name) + ' · até ' + b.end + ' · <span class="mono">' + brl(b.price) + '</span></div></div>' + chip(BK, b.status) + '</div>' +
          '<div class="row wrap" style="margin-top:10px">' + (b.payment_status && b.status !== 'cancelada' ? chip(PS, b.payment_status) : b.payment_status === 'reembolso_pendente' ? chip(PS, b.payment_status) : '') +
          '<span class="chip">Código <span class="mono">' + b.code + '</span></span></div>' +
          (isUp ? '<div class="row" style="margin-top:12px">' +
            (b.status === 'pendente_pagamento' ? '<button class="btn primary sm" data-act="pay-booking" data-id="' + b.booking_id + '">Pagar ' + brl(b.online_amount) + '</button>' : '') +
            (canCancel ? '<button class="btn danger sm" data-act="mcancel" data-id="' + b.booking_id + '">Cancelar</button>' : '') + '</div>' : '') + '</div>';
      };
      box.innerHTML = (up.length ? up.map(function (x) { return card(x, true); }).join('') : '<div class="card empty">Nenhuma reserva futura.<br><button class="btn primary" style="margin-top:12px" data-act="ptab" data-t="reservar">Reservar quadra</button></div>') +
        (past.length ? '<div class="p-label">Anteriores</div>' + past.map(function (x) { return card(x, false); }).join('') : '');
    }).catch(fail);
  }

var ROW_H = 26;
var Recep = {
  render: function () {
    if (!S.recepDate) S.recepDate = S.boot.config.today;
    document.getElementById('app').innerHTML = '<div class="staff"><div class="topbar">' + brandHTML(26) + '<span class="role">Recepção</span>' +

      '<button class="btn sm" data-act="rday" data-d="1" aria-label="Próximo dia">›</button><button class="btn sm" data-act="rtoday">Hoje</button>' +
      '<input type="date" class="input" style="width:auto;padding:6px 8px" id="r-date" value="' + S.recepDate + '"></div>' +
      '<span class="grow"></span><button class="btn primary sm" data-act="rnew">+ Reserva</button><button class="btn sm" data-act="rblock">Bloquear horário</button>' +
      '<a class="btn sm" href="#/bar">Bar</a><button class="btn ghost sm" data-act="logout">Sair</button></div>' +
      '<div class="recep"><div><div class="stats" id="r-stats"></div><div class="tl-wrap" id="r-tl"><div class="spinner"></div></div>' +
      '<div class="legend"><span><i style="background:var(--accent)"></i>Confirmada</span><span><i style="background:#D39A2C"></i>Aguardando pagamento</span><span><i style="background:var(--blue)"></i>Em quadra</span><span><i style="background:#A9B0A6"></i>Concluída</span><span><i style="background:var(--red)"></i>Não compareceu</span></div></div>' +
      '<aside class="side"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h3 style="margin:0">Comandas abertas</h3><button class="btn sm" data-act="rtabnew">+ Avulsa</button></div><div id="r-tabs"></div></aside></div></div>';
    document.getElementById('r-date').addEventListener('change', function (e) { if (e.target.value) { S.recepDate = e.target.value; Recep.load(); } });
    Recep.load();
    every(20000, function () { if (!document.querySelector('#layer .overlay')) Recep.load(); });
  },
  load: function () {
    var lbl = document.getElementById('r-lbl'); if (lbl) lbl.textContent = dLong(S.recepDate);
    var di = document.getElementById('r-date'); if (di) di.value = S.recepDate;
    return api('day', { date: S.recepDate }).then(function (d) { if (S.route !== 'recepcao' || !document.getElementById('r-tl')) return; Recep.data = d; Recep.draw(); }).catch(function (e) { if (e.code === 'pin' || e.code === 'permissao') logout(); else fail(e); });
  },
  draw: function () {
    var d = Recep.data, cfg = d.config, open = U.toMin(cfg.open_time), close = U.toMin(cfg.close_time), step = cfg.slot_step_min;
    var nrows = (close - open) / step, cols = d.courts.length;
    var live = d.bookings.filter(function (b) { return b.status !== 'cancelada' && !(b.status === 'pendente_pagamento' && b.expires_at && Date.parse(b.expires_at) < Date.now()); });
    var bookedMin = live.reduce(function (s, b) { return s + b.duration_min; }, 0);
    var occ = cols ? Math.round(bookedMin / ((close - open) * cols) * 100) : 0;
    var billed = live.reduce(function (s, b) { return s + b.price; }, 0);
    document.getElementById('r-stats').innerHTML =
      '<div class="stat"><div class="v">' + live.length + '</div><div class="l">Reservas</div></div>' +
      '<div class="stat"><div class="v">' + occ + '%</div><div class="l">Ocupação</div></div>' +
      '<div class="stat"><div class="v">' + live.filter(function (b) { return b.status === 'checkin'; }).length + '</div><div class="l">Em quadra</div></div>' +
      '<div class="stat"><div class="v" style="font-size:22px;line-height:1.25">' + brl(billed) + '</div><div class="l">Quadras no dia</div></div>';
    var h = '<div class="tl" style="grid-template-columns:56px repeat(' + cols + ',minmax(150px,1fr))"><div class="tl-head"></div>' +
      d.courts.map(function (c) { return '<div class="tl-head">' + esc(c.name) + '<small>' + esc(c.env) + '</small></div>'; }).join('');

var Bar = {
  render: function () {
    document.getElementById('app').innerHTML = '<div class="topbar">' + brandHTML(26) + '<span class="role">Bar · Cozinha</span><span class="mono" id="b-clock" style="font-size:18px"></span>' +
      '<span class="grow"></span><button class="btn sm" data-act="bsound" id="b-sound">' + (S.sound ? '🔔 Som ligado' : '🔕 Ativar som') + '</button>' +
      '<button class="btn sm" data-act="brefresh">Atualizar</button><button class="btn ghost sm" data-act="logout">Sair</button></div>' +
      '<div class="kanban" id="b-k"><div class="spinner"></div></div><div class="recent" id="b-recent"></div>';
    Bar.first = true; Bar.load();
    every(8000, Bar.load);
    var ck = function () { var el = document.getElementById('b-clock'); if (el) el.textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); };
    ck(); every(15000, ck);
  },
  load: function () {
    api('orders_queue', {}).then(function (q) {
      if (S.route !== 'bar') return;
      var fresh = [];
      q.active.forEach(function (o) { if (o.status === 'novo' && !S.seenOrders[o.order_id]) { if (!Bar.first) fresh.push(o.order_id); S.seenOrders[o.order_id] = 1; } });
      Bar.first = false;
      if (fresh.length) Bar.beep();
      Bar.draw(q, fresh);
    }).catch(function (e) { if (e.code === 'pin' || e.code === 'permissao') logout(); });
  },
  draw: function (q, fresh) {
    var cols = [['novo', 'Novos', 'preparando', 'Começar preparo'], ['preparando', 'Preparando', 'pronto', 'Marcar pronto'], ['pronto', 'Prontos', 'entregue', 'Entregue']];
    var k = document.getElementById('b-k'); if (!k) return;
    k.innerHTML = cols.map(function (c) {
      var list = q.active.filter(function (o) { return o.status === c[0]; });
      return '<section class="kcol"><h2>' + c[1] + ' <span class="n">' + list.length + '</span></h2>' + (list.length ? list.map(function (o) {
        var age = minsAgo(o.created_at);
        return '<article class="ocard' + (fresh.indexOf(o.order_id) >= 0 ? ' new' : '') + '"><div class="hd"><span class="code">#' + o.code + '</span><span class="age ' + (age >= 20 ? 'late' : age >= 10 ? 'warn' : '') + '">' + age + ' min</span></div>' +
          '<div class="who">' + esc(o.customer_name) + (o.location ? ' · <b style="color:#E8EEE6">' + esc(o.location) + '</b>' : '') + (o.pay_mode === 'online' ? ' · <span style="color:var(--ball)">pago</span>' : '') + '</div>' +
          '<ul>' + o.items_json.map(function (i) { return '<li><b>' + i.qty + '×</b>' + esc(i.name) + '</li>'; }).join('') + '</ul>' +
          (o.note ? '<div class="note">⚠ ' + esc(o.note) + '</div>' : '') +
          '<div class="acts">' + (c[0] === 'pronto' ? '<button class="btn sm" data-act="bstatus" data-id="' + o.order_id + '" data-s="preparando" style="flex:0 0 auto">↶</button>' : '') +
          '<button class="btn primary" data-act="bstatus" data-id="' + o.order_id + '" data-s="' + c[2] + '">' + c[3] + '</button>' +
          (c[0] !== 'pronto' ? '<button class="btn sm" style="flex:0 0 auto" data-act="bcancel" data-id="' + o.order_id + '" aria-label="Cancelar pedido">✕</button>' : '') + '</div></article>';
      }).join('') : '<div class="empty" style="color:#5F6F64">—</div>') + '</section>';
    }).join('');
    document.getElementById('b-recent').innerHTML = q.recent.length ? 'Entregues recentemente: ' + q.recent.map(function (o) { return '<span>#' + o.code + ' · ' + esc(o.customer_name) + '</span>'; }).join('') : '';

  setStatus: function (btn, s) {

  },
  beep: function () {
    if (!S.sound) return;
    try {
      var ctx = Bar.ctx || (Bar.ctx = new (window.AudioContext || window.webkitAudioContext)());
      [0, 0.18].forEach(function (t) {
        var o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; o.type = 'sine';
        g.gain.setValueAtTime(0.0001, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.15);
        o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.16);
      });
    } catch (e) { /* sem áudio */ }
  }
};

function catIconKind(text) {
  var t = PEArena.catalog.norm(text);
  if (/cerveja|chopp|chope|long neck|drink|caipir/.test(t)) return 'caneca';
  if (/agua|refri|suco|isoton|bebida|coco|energ|cha |cafe|cola|gatorade/.test(t)) return 'garrafa';
  if (/batata|porc|petisc|frit/.test(t)) return 'porcao';
  if (/sandu|lanche|wrap|acai|salgad|pao|burger|tapioca/.test(t)) return 'lanche';
  if (/bola|loja|raquete|grip|tubo/.test(t)) return 'bola';
  return 'prato';
}
var _iconCache = {};
function catIcon(text) {
  var k = catIconKind(text);
  if (!_iconCache[k]) _iconCache[k] = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="#E2EFE6"/><g fill="none" stroke="#1E6B45" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">' + CAT_ICON_PATHS[k] + '</g></svg>');
  return _iconCache[k];
}
function itemImg(it, size, cls) {
  var fb = catIcon((it.category || '') + ' ' + (it.name || ''));
  return '<img class="thumb ' + (cls || '') + '" style="width:' + size + 'px;height:' + size + 'px" alt="" loading="lazy" src="' + esc(it.image_url || fb) + '"' +
    (it.image_url ? ' onerror="this.onerror=null;this.src=\'' + fb + '\'"' : '') + '>';
}

/* ---- imagem no navegador: ler, girar conforme EXIF (nativo), recortar e comprimir */
var Img = {
  read: function (file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file), im = new Image();
      im.onload = function () { res(im); }; im.onerror = function () { rej(new Error('Não consegui abrir a imagem.')); };
      im.src = url;
    });
  },
  jpeg: function (im, max, square, q) {
    var w = im.naturalWidth, h = im.naturalHeight, sx = 0, sy = 0, sw = w, sh = h;
    if (square) { var m = Math.min(w, h); sx = (w - m) / 2; sy = (h - m) / 2; sw = sh = m; }
    var k = Math.min(1, max / Math.max(sw, sh)), cw = Math.round(sw * k), ch = Math.round(sh * k);
    var c = document.createElement('canvas'); c.width = cw; c.height = ch;
    var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cw, ch); g.drawImage(im, sx, sy, sw, sh, 0, 0, cw, ch);
    var dataUrl = c.toDataURL('image/jpeg', q || 0.82);
    return { dataUrl: dataUrl, b64: dataUrl.split(',')[1], mime: 'image/jpeg', w: cw, h: ch };
  },
  zxing: null,
  barcode: function (im, dataUrl) {
    var formats = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'];
    var viaZxing = function () {
      var load = window.ZXing ? Promise.resolve() : (Img.zxing || (Img.zxing = new Promise(function (res, rej) {
        var s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.23.0/umd/index.min.js';
        s.onload = res; s.onerror = function () { Img.zxing = null; rej(new Error('leitor indisponível')); }; document.head.appendChild(s);
      })));
      return load.then(function () { return new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(dataUrl); })
        .then(function (r) { return r ? r.getText() : ''; }).catch(function () { return ''; });
    };
    if ('BarcodeDetector' in window) {
      return window.BarcodeDetector.getSupportedFormats().then(function (sup) {
        var f = formats.filter(function (x) { return sup.indexOf(x) >= 0; });
        if (!f.length) return viaZxing();
        return new window.BarcodeDetector({ formats: f }).detect(im).then(function (r) { return r.length ? r[0].rawValue : viaZxing(); });
      }).catch(viaZxing);
    }
    return viaZxing();
  }
};

/* ---- modo demo: visão direto do navegador com chave guardada só neste aparelho */
var DemoVision = {
  key: function () { return store.get('arena_demo_vision_key', ''); },
  recognize: function (payload) {
    var key = DemoVision.key();
    if (!key) return Promise.reject(Object.assign(new Error('No modo demo, informe uma chave da API da Anthropic em Admin → Sistema para testar o reconhecimento por foto (fica só neste aparelho). Em produção a chave fica no Apps Script. O código de barras funciona sem chave.'), { code: 'indisponivel' }));
    var menu = local.svc.handle('admin_data', {}, '9999').data.menu;
    var prompt = PEArena.catalog.prompt(PEArena.catalog.categories(menu), menu.map(function (m) { return m.name; }));
    return fetch('https://api.anthropic.com/v1/messages', { method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: store.get('arena_demo_vision_model', '') || 'claude-haiku-4-5-20251001', max_tokens: 2000,
        messages: [{ role: 'user', content: [{ type: 'image', source: { type: 'base64', media_type: payload.mime, data: payload.b64 } }, { type: 'text', text: prompt }] }] })
    }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error('API de visão ' + r.status + ': ' + ((j.error && j.error.message) || '')); return j; }); })
      .then(function (j) {
        var text = (j.content || []).filter(function (c) { return c.type === 'text'; }).map(function (c) { return c.text; }).join('\n');
        var parsed = PEArena.catalog.parse(text);
        return { kind: parsed.kind, items: PEArena.catalog.clean(parsed.items, menu), warning: parsed.error || '' };
      });
  },
  offCache: {},
  prefetch: function (code) {
    code = String(code || '').replace(/\D/g, '');
    if (!code || DemoVision.offCache.hasOwnProperty(code)) return Promise.resolve();
    return fetch('https://world.openfoodfacts.org/api/v2/product/' + code + '.json?fields=product_name,product_name_pt,brands,quantity,image_front_url,categories')
      .then(function (r) { return r.json(); }).then(function (j) {
        var pr = j && j.status === 1 ? j.product : null, name = pr ? (pr.product_name_pt || pr.product_name || '') : '';
        DemoVision.offCache[code] = name ? { name: name, brand: String(pr.brands || '').split(',')[0].trim(), quantity: pr.quantity || '', categories: pr.categories || '', image_url: pr.image_front_url || '' } : null;
      }).catch(function () { DemoVision.offCache[code] = null; });
  }
};

  coverageGap: function () {
    var m = Pz.draft, r = Pz.d, open = U.toMin(r.open_time), close = U.toMin(r.close_time), step = r.slot_step_min, miss = 0;
    for (var w = 0; w < 7; w++) for (var t = open; t < close; t += step) if (!PEArena.pricing.groupAt(m, pzDateFor(w), t)) miss += step;
    return miss ? Math.round(miss / 60 * 10) / 10 : 0;
  },
  heatHTML: function () {
    var r = Pz.d, metric = Pz.metric, env = metric === 'price' && Pz.env === '_all' ? r.envs[0] : Pz.env;
    var hm = r.heat[env] || r.heat._all;

    var hours = hm[0].map(function (c) { return c.h; });
    var cells = [], vals = [];
    PZ_WD_ORDER.forEach(function (w) {
      hm[w].forEach(function (c) {
        var g = PEArena.pricing.groupAt(Pz.draft, pzDateFor(w), c.h * 60);

        var v = metric === 'occ' ? c.occ : price;

    var idx = function (v) { if (v === null || v === undefined) return -1; if (hi === lo) return 3; return Math.max(0, Math.min(PZ_RAMP.length - 1, Math.floor((v - lo) / (hi - lo) * PZ_RAMP.length - 1e-9))); };

      }).join('') + '</div></div></div><div id="pz-preview"></div></div>';
    var f = document.getElementById('pz-file');

      var file = f.files[0]; if (!file) return;

  },
  parseCSV: function (text) {
    var lines = text.replace(/\r/g, '').split('\n').filter(function (l) { return l.trim(); });
    if (lines.length < 2) return { rows: [], header: [] };
    var first = lines[0], sep = (first.match(/\t/g) || []).length ? '\t' : (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ';' : ',';
    var split = function (l) {
      var out = [], cur = '', q = false;
      for (var i = 0; i < l.length; i++) { var ch = l[i]; if (ch === '"') { if (q && l[i + 1] === '"') { cur += '"'; i++; } else q = !q; } else if (ch === sep && !q) { out.push(cur); cur = ''; } else cur += ch; }
      out.push(cur); return out.map(function (x) { return x.trim(); });
    };
    var norm = function (s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z]/g, ''); };
    var MAP = { data: 'date', date: 'date', dia: 'date', datahora: 'date', inicio: 'start', horainicio: 'start', hora: 'start', horario: 'start', start: 'start', entrada: 'start',
      fim: 'end', termino: 'end', horafim: 'end', end: 'end', saida: 'end', duracao: 'duration', duration: 'duration', minutos: 'duration', tempo: 'duration',
      quadra: 'court', court: 'court', local: 'court', tipo: 'env', ambiente: 'env', env: 'env', cobertura: 'env', valor: 'price', preco: 'price', price: 'price', total: 'price', status: 'status', situacao: 'status' };
    var header = split(lines[0]), keys = header.map(function (x) { return MAP[norm(x)] || ''; });
    var rows = lines.slice(1).map(function (l) { var c = split(l), o = {}; keys.forEach(function (k, i) { if (k && !o[k]) o[k] = c[i] || ''; }); return o; });
    return { rows: rows, header: header, keys: keys };
  },
  parse: function () {
    var text = val('pz-paste'), out = document.getElementById('pz-preview');
    var p = Pz.parseCSV(text);
    if (!p.rows.length) { out.innerHTML = '<div class="notice" style="margin-top:12px">Cole ou escolha um CSV com cabeçalho e pelo menos uma linha.</div>'; return; }
    var need = ['date'], miss = need.filter(function (k) { return p.keys.indexOf(k) < 0; });
    var res = PEArena.pricing.parseHistory(p.rows, Pz.d.courts);
    Pz.pending = p.rows;
    var from = '', to = '', byEnv = {};
    res.rows.forEach(function (x) { if (!from || x.date < from) from = x.date; if (!to || x.date > to) to = x.date; byEnv[x.env] = (byEnv[x.env] || 0) + 1; });
    var skipped = res.errors.filter(function (e) { return e.skip; }).length, bad = res.errors.length - skipped;
    out.innerHTML = '<div class="divider"></div><div class="row wrap" style="gap:18px;margin-bottom:10px">' +
      '<div><div class="pz-k">Colunas</div><div class="small">' + p.header.map(function (hh, i) { return p.keys[i] ? '<span class="chip green">' + esc(hh) + ' → ' + p.keys[i] + '</span>' : '<span class="chip">' + esc(hh) + ' (ignorada)</span>'; }).join(' ') + '</div></div></div>' +
      (miss.length ? '<div class="notice">Falta a coluna de data.</div>' : '') +
      '<div class="kpis" style="margin-bottom:10px"><div class="kpi"><div class="l">Jogos válidos</div><div class="v">' + res.rows.length.toLocaleString('pt-BR') + '</div><div class="s">' + Object.keys(byEnv).map(function (e) { return e + ': ' + byEnv[e]; }).join(' · ') + '</div></div>' +
      '<div class="kpi"><div class="l">Período</div><div class="v" style="font-size:22px;line-height:1.5">' + (from ? dShort(from) + '/' + from.slice(2, 4) + ' – ' + dShort(to) + '/' + to.slice(2, 4) : '—') + '</div></div>' +
      '<div class="kpi"><div class="l">Ignoradas</div><div class="v">' + res.errors.length + '</div><div class="s">' + skipped + ' canceladas · ' + bad + ' com erro</div></div></div>' +
      (bad ? '<details style="margin-bottom:10px"><summary class="small">Ver linhas com erro</summary><div class="small mono" style="max-height:160px;overflow:auto;margin-top:6px">' + res.errors.filter(function (e) { return !e.skip; }).slice(0, 50).map(function (e) { return 'linha ' + e.line + ': ' + esc(e.reason); }).join('<br>') + '</div></details>' : '') +
      '<div class="row wrap"><div class="field" style="margin:0;width:260px"><label>Nome da importação</label><input class="input" id="pz-batch" value="' + esc('Histórico ' + (from ? dShort(from) + '/' + from.slice(0, 4) + ' a ' + dShort(to) + '/' + to.slice(0, 4) : '')) + '"></div>' +
      '<label class="check" style="align-self:flex-end"><input type="checkbox" id="pz-replace">Substituir histórico existente</label>' +
      '<button class="btn primary" style="align-self:flex-end" data-act="pzimport"' + (res.rows.length ? '' : ' disabled') + '>Importar ' + res.rows.length.toLocaleString('pt-BR') + ' jogos</button></div>';
  },
  doImport: function (btn) {
    var courts = {}; document.querySelectorAll('[data-pzhc]').forEach(function (el) { courts[el.dataset.pzhc] = Number(el.value) || 0; });
    btn.disabled = true;

  },
  template: function () {
    var csv = '﻿data;inicio;duracao;quadra;valor;status\n25/09/2026;18:00;90;Padel Indoor 1;210,00;Pago\n25/09/2026;19:30;90;Padel Outdoor;165,00;Pago\n26/09/2026;08:00;60;Indoor;105,00;Cancelado\n';
